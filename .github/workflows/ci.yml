name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: Faraz Hussain
  GIT_AUTHOR_EMAIL: farazhussain5000@gmail.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.14.7
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Run tests with a real Tk display on Windows
        if: runner.os == 'Windows'
        run: uv run --locked pytest
      - name: Run tests under Xvfb on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked pytest
      - run: uv run --locked pip-audit
      - run: uv build --no-sources
