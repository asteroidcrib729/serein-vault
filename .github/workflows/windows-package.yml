name: Windows package builder

on:
  workflow_call:
    inputs:
      format:
        required: true
        type: string
    outputs:
      artifact_name:
        description: Verified installer artifact for this exact run and attempt
        value: ${{ jobs.package.outputs.artifact_name }}

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: Faraz Hussain
  GIT_AUTHOR_EMAIL: farazhussain5000@gmail.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact_name: serein-vault-windows-${{ inputs.format }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.14.7
      - run: uv sync --locked --group packaging
      - run: uv run --locked --group packaging ruff check .
      - run: uv run --locked --group packaging ruff format --check .
      - run: uv run --locked --group packaging pytest
      - run: uv run --locked --group packaging pip-audit
      - name: Build from current source
        id: build
        env:
          PACKAGE_FORMAT: ${{ inputs.format }}
        run: uv run --locked --group packaging python packaging/build_windows.py --format $env:PACKAGE_FORMAT
      - name: Install, probe, and uninstall EXE
        if: inputs.format == 'exe'
        env:
          RELEASE_DIRECTORY: ${{ steps.build.outputs.release_directory }}
        run: |
          $installer = Get-ChildItem -LiteralPath $env:RELEASE_DIRECTORY -Filter '*-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'EXE installer missing.' }
          ./packaging/test_installer.ps1 -Installer $installer.FullName -EvidenceDirectory $env:RELEASE_DIRECTORY
      - name: Verify final artifacts and evidence
        env:
          RELEASE_DIRECTORY: ${{ steps.build.outputs.release_directory }}
        run: uv run --locked --group packaging python packaging/verify_release.py $env:RELEASE_DIRECTORY --refresh-checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serein-vault-windows-${{ inputs.format }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.release_directory }}/*
          if-no-files-found: error
          retention-days: 14
